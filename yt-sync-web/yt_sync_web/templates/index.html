<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yt-sync • YouTube Playlist Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- HTMX 2.x Official CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #09090b; } /* zinc-950 */

        /* HTMX Indicator display and transitions */
        .htmx-indicator { 
            opacity: 0; 
            display: none;
            transition: opacity 200ms ease-in; 
        }
        .htmx-request.htmx-indicator,
        .htmx-request .htmx-indicator { 
            opacity: 1; 
            display: flex;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 sm:px-6 lg:px-8 text-zinc-300 font-sans">
    <div class="max-w-5xl w-full flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 pb-6 border-b border-white/5">
            <div class="flex items-center gap-4">
                <!-- Logo Icon -->
                <div class="w-12 h-12 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center text-indigo-400 shadow-lg shadow-indigo-900/20">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 9.75L16.5 12l-2.25 2.25m-4.5 0L7.5 12l2.25-2.25M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-zinc-100">
                        yt-sync <span class="text-sm font-medium text-zinc-500">Dashboard</span>
                    </h1>
                    <p class="text-sm text-zinc-500 mt-0.5">
                        Scoped folder YouTube playlist synchronization
                    </p>
                </div>
            </div>

            <!-- Target Folder Pill -->
            {% if target_dir %}
            <div class="flex items-center gap-2.5 bg-zinc-900/50 border border-white/5 px-3 py-2 rounded-lg text-xs">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 text-zinc-500">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
                </svg>
                <span class="font-mono text-zinc-400 truncate max-w-[200px] sm:max-w-md" title="{{ target_dir }}">
                    {{ target_dir }}
                </span>
            </div>
            {% endif %}
        </header>

        <!-- Dynamic Content Container -->
        <main id="dashboard-content" class="w-full space-y-6">
            {% if init_needed %}
                {% include "fragments/init_form.html" %}
            {% else %}
                {% include "fragments/dashboard.html" %}
            {% endif %}
        </main>
    </div>
</body>
</html>
