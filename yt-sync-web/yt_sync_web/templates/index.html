<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yt-sync • YouTube Playlist Dashboard</title>
    <!-- HTMX 2.x Official CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full flex flex-col items-center py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-5xl w-full space-y-6">
        <!-- Main Top Bar -->
        <header class="flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-slate-800 pb-5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-xl shadow-lg shadow-purple-900/30">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight text-white">
                        yt-sync <span class="text-sm font-normal text-purple-400">Dashboard</span>
                    </h1>
                    <p class="text-xs text-slate-400">
                        Scoped folder YouTube playlist synchronization
                    </p>
                </div>
            </div>

            <!-- Target Folder Pill -->
            {% if target_dir %}
            <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full text-xs text-slate-300">
                <span class="text-slate-500">Folder:</span>
                <span class="font-mono text-purple-300 truncate max-w-xs sm:max-w-md">{{ target_dir }}</span>
            </div>
            {% endif %}
        </header>

        <!-- Dynamic Content Container -->
        <main id="dashboard-content" class="transition-all">
            {% if init_needed %}
                {% include "fragments/init_form.html" %}
            {% else %}
                {% include "fragments/dashboard.html" %}
            {% endif %}
        </main>
    </div>
</body>
</html>
