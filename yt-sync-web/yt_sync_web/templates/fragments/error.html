<div class="bg-zinc-900/40 backdrop-blur-xl border border-rose-500/30 rounded-2xl p-6 text-rose-200 shadow-2xl relative overflow-hidden space-y-4">
    <div class="absolute -top-12 -right-12 w-32 h-32 bg-rose-500/10 blur-[50px] pointer-events-none"></div>
    <div class="relative z-10 flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>
        <div class="space-y-1 min-w-0">
            <h3 class="text-base font-semibold text-rose-100">An Error Occurred</h3>
            <p class="text-xs text-rose-300 font-mono break-all leading-relaxed">{{ error_message }}</p>
        </div>
    </div>
    <div class="relative z-10 pt-3 border-t border-white/5 flex justify-end">
        <button hx-post="/refresh"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                hx-indicator="#loading-spinner"
                class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-zinc-100 font-medium text-xs transition-all shadow-sm flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5 text-zinc-400">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Retry Operation
        </button>
    </div>
</div>
