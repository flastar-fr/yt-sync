<div class="bg-rose-950/60 border border-rose-500/50 rounded-xl p-6 text-rose-200 shadow-lg space-y-3">
    <div class="flex items-start gap-3">
        <span class="text-2xl">⚠️</span>
        <div class="space-y-1">
            <h3 class="text-base font-bold text-rose-100">An Error Occurred</h3>
            <p class="text-sm text-rose-300 font-mono break-all">{{ error_message }}</p>
        </div>
    </div>
    <div class="pt-2 border-t border-rose-900/40 flex justify-end">
        <button hx-post="/refresh"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                hx-indicator="#loading-spinner"
                class="px-4 py-1.5 rounded-lg bg-rose-900/60 hover:bg-rose-800 text-rose-100 text-xs font-medium transition">
            Retry Operation
        </button>
    </div>
</div>
