<div class="bg-slate-800/90 border border-slate-700 rounded-xl p-8 shadow-xl max-w-2xl mx-auto space-y-6">
    <div class="text-center space-y-2 border-b border-slate-700/80 pb-5">
        <span class="text-4xl">🚀</span>
        <h2 class="text-2xl font-bold text-slate-100">Initialize Folder Synchronization</h2>
        <p class="text-slate-400 text-sm">
            No synchronization state found in this folder. Enter the YouTube playlist URL to link with this directory.
        </p>
    </div>

    <div class="bg-slate-900/60 border border-slate-700 rounded-lg p-4 text-xs space-y-1">
        <span class="font-semibold text-slate-400 uppercase tracking-wider">Scoped Target Directory:</span>
        <div class="font-mono text-purple-300 break-all">{{ target_dir }}</div>
    </div>

    <form hx-post="/initialize"
          hx-target="#dashboard-content"
          hx-swap="innerHTML"
          hx-indicator="#init-spinner"
          class="space-y-4">

        <div>
            <label for="playlist_url" class="block text-sm font-medium text-slate-300">
                YouTube Playlist URL
            </label>
            <input type="url"
                   id="playlist_url"
                   name="playlist_url"
                   required
                   placeholder="https://www.youtube.com/playlist?list=PL..."
                   class="mt-1 block w-full rounded-lg bg-slate-900 border border-slate-700 px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-purple-500 text-sm">
        </div>

        <div class="flex items-center justify-between pt-3">
            <button type="submit"
                    class="px-6 py-2.5 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm transition shadow-md flex items-center gap-2">
                <span>🔗 Link & Load Playlist</span>
            </button>

            <div id="init-spinner" class="htmx-indicator flex items-center gap-2 text-purple-400 text-sm">
                <svg class="animate-spin h-5 w-5 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span>Fetching playlist metadata...</span>
            </div>
        </div>
    </form>
</div>
